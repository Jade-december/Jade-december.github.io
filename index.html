<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈玉瑶 2025106076 - 作业作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            color: #fff;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header .student-id {
            font-size: 1.2em;
            opacity: 0.9;
        }

        header .course {
            margin-top: 15px;
            font-size: 0.95em;
            opacity: 0.8;
        }

        .assignments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .assignment-card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .assignment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .assignment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .assignment-card.disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .assignment-card.disabled:hover {
            transform: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .assignment-number {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .assignment-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .assignment-desc {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .assignment-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
        }

        .status-done {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-pending {
            background: #f5f5f5;
            color: #999;
        }

        footer {
            text-align: center;
            color: #fff;
            padding: 20px 0;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
            }
            .assignments {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>陈玉瑶</h1>
            <p class="student-id">学号：2025106076</p>
            <p class="course">网页设计与制作 · 作业作品集</p>
        </header>

        <div class="assignments">
            <a href="Assignment1/index.html" class="assignment-card">
                <div class="assignment-number">01</div>
                <div class="assignment-title">第一次作业</div>
                <div class="assignment-desc">网页设计与制作 - 个人作品集展示网站</div>
                <span class="assignment-status status-done">已完成</span>
            </a>

            <div class="assignment-card disabled">
                <div class="assignment-number">02</div>
                <div class="assignment-title">第二次作业</div>
                <div class="assignment-desc">敬请期待</div>
                <span class="assignment-status status-pending">未开始</span>
            </div>

            <div class="assignment-card disabled">
                <div class="assignment-number">03</div>
                <div class="assignment-title">第三次作业</div>
                <div class="assignment-desc">敬请期待</div>
                <span class="assignment-status status-pending">未开始</span>
            </div>

            <div class="assignment-card disabled">
                <div class="assignment-number">04</div>
                <div class="assignment-title">第四次作业</div>
                <div class="assignment-desc">敬请期待</div>
                <span class="assignment-status status-pending">未开始</span>
            </div>

            <div class="assignment-card disabled">
                <div class="assignment-number">05</div>
                <div class="assignment-title">第五次作业</div>
                <div class="assignment-desc">敬请期待</div>
                <span class="assignment-status status-pending">未开始</span>
            </div>
        </div>

        <footer>
            <p>© 2026 陈玉瑶 2025106076 | Powered by GitHub Pages</p>
        </footer>
    </div>
</body>
</html>
